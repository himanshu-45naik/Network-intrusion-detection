name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Only the serving deps: the API tests build their own synthetic model, so
      # ZenML, MLflow and the 235 MB dataset are not needed to verify the
      # service contract.
      - name: Install serving dependencies
        run: pip install -r requirements-serving.txt pytest httpx
      - name: Run tests
        run: pytest tests -q

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      # Builds the exact image that gets deployed, so a broken Dockerfile or a
      # missing model bundle fails here rather than on the deploy.
      - name: Build inference image
        run: docker build -t nids-api:${{ github.sha }} .
      - name: Boot the container and check readiness
        run: |
          docker run -d --name nids -p 8000:8000 nids-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/ready; then break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8000/ready
      - name: Smoke test the running container
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000 --flows 400
      - name: Container logs
        if: always()
        run: docker logs nids
